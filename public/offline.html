<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#255b43"><title>Offline · CampusClass</title>
<style>
:root{color-scheme:light dark}*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;background:#f4f7f5;color:#182e21;font:16px system-ui,-apple-system,sans-serif;padding:20px}
main{max-width:480px;background:#fff;border:1px solid #dee8df;border-radius:24px;padding:clamp(24px,7vw,40px);box-shadow:0 24px 65px #143b2210}
.brand{display:inline-block;background:#e4f0e7;padding:8px 12px;border-radius:10px;color:#255b43;font-weight:750;letter-spacing:-.03em}
h1{font-size:clamp(25px,7vw,36px);line-height:1.1;letter-spacing:-.04em}p{color:#536b5b;line-height:1.65;font-size:14px}
button{border:0;border-radius:12px;padding:13px 18px;background:#255b43;color:#fff;font:700 14px system-ui;cursor:pointer}
small{display:block;margin-top:26px;line-height:1.6;color:#748879}
</style></head><body><main><div class="brand">CampusClass 2.0</div>
<h1>You’re offline.</h1>
<p>Your internet connection appears unavailable. For privacy, this device does not save student records, private PDFs or class dashboards automatically.</p>
<button type="button" onclick="location.reload()">Try again</button>
<small>Reconnect to access your classes, notes, attendance and assessments securely.</small>
</main></body></html>

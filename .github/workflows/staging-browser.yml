name: CampusClass Staging Browser Acceptance

on:
  workflow_dispatch:
    inputs:
      staging_url:
        description: "Staging deployment URL, not production"
        required: true
        type: string

jobs:
  playwright:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CI: true
      E2E_BASE_URL: ${{ inputs.staging_url }}
      E2E_ADMIN_EMAIL: ${{ secrets.CAMPUSCLASS_E2E_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.CAMPUSCLASS_E2E_ADMIN_PASSWORD }}
      E2E_STUDENT_EMAIL: ${{ secrets.CAMPUSCLASS_E2E_STUDENT_EMAIL }}
      E2E_STUDENT_PASSWORD: ${{ secrets.CAMPUSCLASS_E2E_STUDENT_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Run anonymous and staging-role browser acceptance
        run: pnpm run test:e2e
      - name: Upload traces on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: |
            test-results/
            playwright-report/
          retention-days: 7
